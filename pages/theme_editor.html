<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 主题系统 CSS -->
    <link rel="stylesheet" href="../src/css/theme/base.css">
    <link rel="stylesheet" href="../src/css/theme/light.css" id="theme-stylesheet">
    <!-- 统一标题栏 CSS -->
    <link rel="stylesheet" href="../src/components/UnifiedTitleBar.css">
    <link rel="stylesheet" href="../src/theme-editor/themeEditor.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LovelyTheme Editor v2.0 - 模块化主题编辑器</title>
    <script type="module" src="../src/theme-editor/ThemeEditorApp.ts" defer></script>
    <!-- 水印脚本 -->
    <!-- 子窗口主题同步 -->
    <script src="../src/utils/themeBridge.ts" type="module" defer></script>
  </head>

  <body>
    <div id="app">
      <div class="loading-screen">
        <div class="loading-content">
          <div class="loading-icon">🎨</div>
          <h2>LovelyTheme Editor</h2>
          <p>正在加载主题编辑器...</p>
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>

    <style>
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      .loading-content {
        text-align: center;
        color: white;
      }

      .loading-icon {
        font-size: 48px;
        margin-bottom: 16px;
        animation: pulse 2s infinite;
      }

      .loading-content h2 {
        font-size: 24px;
        margin: 0 0 8px 0;
        font-weight: 600;
      }

      .loading-content p {
        font-size: 16px;
        margin: 0 0 24px 0;
        opacity: 0.9;
      }

      .loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
