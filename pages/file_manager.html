<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理器 - Lovelymem V2</title>
    <!-- 主题系统 CSS - 必须先加载 -->
    <link rel="stylesheet" href="../src/css/theme/base.css">
    <link rel="stylesheet" href="../src/css/theme/light.css" id="theme-stylesheet">
    <!-- 组件样式 -->
    <link rel="stylesheet" href="../src/modernStyles.css">
    <link rel="stylesheet" href="../src/file-manager/fileManager.css">
    <!-- 水印脚本 -->
</head>
<body data-theme="light">
    <!-- 自定义标题栏 - 与主界面保持一致 -->
    <div class="modern-title-bar">
        <div class="title-bar-content">
            <div class="app-logo">
                <span class="logo-icon">
                    <svg class="app-logo-svg" width="24" height="24" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path class="star-path" d="M100 25 L118 68 L165 72 L129 103 L140 148 L100 124 L60 148 L71 103 L35 72 L82 68 Z" fill="var(--logo-star-color, #FBBF24)" stroke="var(--logo-star-color, #FBBF24)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
                        <path class="wave-1" d="M40 145 C 60 135, 80 155, 100 155 C 120 155, 140 135, 160 145" stroke="var(--logo-wave1-color, #3B82F6)" stroke-width="14" stroke-linecap="round" fill="none"/>
                        <path class="wave-2" d="M40 170 C 60 160, 80 180, 100 180 C 120 180, 140 160, 160 170" stroke="var(--logo-wave2-color, #2563EB)" stroke-width="14" stroke-linecap="round" fill="none"/>
                        <circle class="bubble-1" cx="170" cy="50" r="6" fill="var(--logo-bubble1-color, #60A5FA)"/>
                        <circle class="bubble-2" cx="30" cy="100" r="4" fill="var(--logo-bubble2-color, #93C5FD)"/>
                        <circle class="bubble-3" cx="160" cy="110" r="3" fill="var(--logo-bubble3-color, #BFDBFE)"/>
                    </svg>
                </span>
                <span class="logo-text">文件管理器</span>
            </div>
            <div class="title-bar-info">
                <span class="app-subtitle">Lovelymem V2</span>
            </div>
        </div>
        <div class="title-bar-shortcuts">
            <!-- 可以在这里添加快捷按钮 -->
        </div>
        <div class="window-controls">
            <div class="control-button minimize" id="minimize-btn">
                <svg viewBox="0 0 24 24"><path d="M6 12h12v2H6z"/></svg>
            </div>
            <div class="control-button maximize" id="maximize-btn">
                <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
            </div>
            <div class="control-button close" id="close-btn">
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M6 18L18 6"/></svg>
            </div>
        </div>
    </div>

    <!-- 主要内容区域 -->
    <div class="file-manager-content">
        <!-- 文件面板头部 -->
        <div class="file-panel-header">
            <div class="file-panel-navigation">
                <button class="nav-btn back-btn" title="返回上一级" data-action="go-back">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="breadcrumb-container">
                    <!-- 面包屑导航将在这里动态生成 -->
                </div>
            </div>
            <div class="file-panel-controls">
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="搜索文件..." />
                    <button class="search-clear" title="清空搜索">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div class="sort-controls">
                    <button class="sort-btn active" data-sort="name" title="按文件名排序">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18M7 12h10m-7 6h4"/>
                        </svg>
                        <span>名称</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="sort-indicator asc">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <button class="sort-btn" data-sort="size" title="按文件大小排序">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                        </svg>
                        <span>大小</span>
                    </button>
                    <button class="sort-btn" data-sort="created" title="按创建时间排序">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <span>时间</span>
                    </button>
                </div>
                <div class="action-buttons">
                    <button class="action-btn" title="新建文件夹" data-action="new-folder">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            <line x1="12" y1="11" x2="12" y2="17"/>
                            <line x1="9" y1="14" x2="15" y2="14"/>
                        </svg>
                    </button>
                    <button class="action-btn danger-btn" title="清空输出目录" data-action="clear-output">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18"/>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                            <line x1="10" y1="11" x2="10" y2="17"/>
                            <line x1="14" y1="11" x2="14" y2="17"/>
                        </svg>
                    </button>
                    <button class="action-btn" title="刷新" data-action="refresh">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/>
                            <polyline points="1 20 1 14 7 14"/>
                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                        </svg>
                    </button>
                    <button class="action-btn" title="切换到挂载盘" data-action="switch-m-drive">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21,15 16,10 5,21"/>
                        </svg>
                    </button>
                    <button class="action-btn" title="切换到输出目录" data-action="switch-output">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14,2 14,8 20,8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10,9 9,9 8,9"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 文件列表区域 -->
        <div class="file-panel-content">
            <div class="file-list">
                <div class="loading">🔄 正在加载文件列表...</div>
            </div>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-text">就绪</div>
            <div class="status-info">
                <span class="file-count">0 个项目</span>
            </div>
        </div>
    </div>

    <!-- 右键菜单 -->
    <div class="context-menu" id="contextMenu" style="display: none;">
        <!-- 右键菜单项将在这里动态生成 -->
    </div>

    <script type="module" src="../src/file-manager/fileManagerApp.ts"></script>
</body>
</html>
