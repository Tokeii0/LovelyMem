<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex 查看器 - Lovelymem V2</title>
    <link rel="stylesheet" href="../src/css/theme/base.css">
    <link rel="stylesheet" href="../src/css/theme/light.css" id="theme-stylesheet">
    <link rel="stylesheet" href="../src/modules/hex-viewer/styles/hex-viewer.css">
    <script src="../src/modules/hex-viewer/hex-viewer.ts" type="module" defer></script>
    <script src="../src/utils/themeBridge.ts" type="module" defer></script>
</head>
<body>
    <div id="hex-viewer-app">
        <div class="hv-window-titlebar" data-tauri-drag-region>
            <div class="hv-window-title" data-tauri-drag-region>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                <span>Hex 查看器</span>
            </div>
            <div class="hv-window-controls">
                <button class="hv-window-btn" id="minimizeBtn" title="最小化">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button class="hv-window-btn" id="maximizeBtn" title="最大化">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
                </button>
                <button class="hv-window-btn close" id="closeBtn" title="关闭">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
                </button>
            </div>
        </div>
        <!-- 主体由 hex-viewer.ts 注入 -->
    </div>
</body>
</html>
